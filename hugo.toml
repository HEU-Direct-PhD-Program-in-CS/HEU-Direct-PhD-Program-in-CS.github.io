baseURL = "https://heu-cs-dphd.github.io/"
defaultContentLanguage = "zh_cn"
enableEmoji = true
enableRobotsTXT = true
locale = "zh"
# Build draft pages so that their URLs still render. The theme layouts remove
# them from every navigational/indexing surface.
buildDrafts = true
theme = "gokarna"
title = "HEU本博班's Blog"

[params]
  avatarAltText = "avatar"
  avatarSize = "size-m"
  avatarURL = "/images/avatar.webp"

  customHeadHTML = """
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh" crossorigin="anonymous"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          // customised options
          // • auto-render specific keys, e.g.:
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
          ],
          // • rendering keys, e.g.:
          throwOnError : false
        });
      });
    </script>
  """

  description = "Sky above, sand below and peace within"
  footer = "The Marauders"
  metaKeywords = ["blog", "gokarna", "hugo"]
  showBackToTopButton = true # true or false for "back to top" button on posts and pages

  socialIcons = [
    {name = "twitter", url = "https://example.com"},
    {name = "linkedin", url = "https://example.com"},
    {name = "stackoverflow", url = "https://example.com"},
    {name = "dribbble", url = "https://example.com"},
    {name = "instagram", url = "https://example.com"},
    {name = "twitch", url = "https://example.com"},
    {name = "email", url = "mailto:example@example.com"}
  ]

# Syntax highlighting palette. Any value can be changed independently.
[params.codeBlock.light]
  background = "#f6f8fa"
  text = "#24292f"
  border = "#d0d7de"
  comment = "#656d76"
  keyword = "#cf222e"
  name = "#8250df"
  string = "#0a3069"
  number = "#0550ae"
  operator = "#0550ae"
  punctuation = "#24292f"
  variable = "#953800"
  tag = "#116329"
  builtin = "#0550ae"
  constant = "#0550ae"
  error = "#82071e"

[params.codeBlock.dark]
  background = "#161b22"
  text = "#e6edf3"
  border = "#30363d"
  comment = "#8b949e"
  keyword = "#ff7b72"
  name = "#d2a8ff"
  string = "#a5d6ff"
  number = "#79c0ff"
  operator = "#ff7b72"
  punctuation = "#c9d1d9"
  variable = "#ffa657"
  tag = "#7ee787"
  builtin = "#79c0ff"
  constant = "#79c0ff"
  error = "#ff7b72"

[menu]
  [[menu.main]]
    name = "Home"
    pre = "<span data-feather='home'></span>"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Posts"
    pre = "<span data-feather='book'></span>"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "Projects"
    pre = "<span data-feather='code'></span>"
    url = "/projects/"
    weight = 3

  [[menu.main]]
    name = "Tags"
    pre = "<span data-feather='tag'></span>"
    url = "/tags/"
    weight = 4

  [[menu.main]]
    identifier = "github"
    pre = "<span data-feather='github'></span>"
    url = "https://github.com/heu-cs-dphd"
    weight = 5

  [[menu.main]]
    identifier = "buymeacoffee"
    pre = "<span data-feather='coffee'></span>"
    url = "https://example.com"
    weight = 6

  [[menu.main]] 
    identifier = "rss"
    pre = "<span data-feather='rss'></span>"
    url = "/index.xml"
    weight = 7

[markup]
  [markup.highlight]
    # Keep token classes in the generated HTML so the theme can provide
    # separate, accessible palettes for light and dark mode.
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
    tabWidth = 4
    wrapperClass = "highlight"
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
    minifyOutput = true
